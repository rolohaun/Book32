[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32@6.12.0
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0
    mathertel/OneButton @ ^2.0.3
    bblanchon/ArduinoJson @ ^6.21.3
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    tzapu/WiFiManager @ ^2.0.17
    bitbank2/unzipLIB @ ^1.0.0
    bitbank2/PNGdec @ 1.1.6
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
    bitbank2/bb_epaper @ ^2.1.7
    https://github.com/thijse/Arduino-Log.git
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D PNG_MAX_BUFFERED_PIXELS=16416
    -I include
    ; bb_epaper includes SPI from an .inl file that PlatformIO's dependency
    ; scanner cannot see, so expose the bundled framework header explicitly.
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
board_build.filesystem = littlefs

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
lib_ignore = FastEPD

; Seeed XIAO S3 High-Spec (16MB Flash, 8MB PSRAM)
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_SEEED_XIAO_ESP32S3

; LittleFS uploadfs targets the 1MB "spiffs" web partition. The separate
; 10MB "ebooks" partition is mounted by InkDeck at runtime.

[env:seeed_reterminal_sticky]
board = esp32-s3-devkitc-1
lib_ignore = FastEPD

; Seeed reTerminal E1002 / Sticky (32MB Flash, 8MB PSRAM)
board_build.partitions = partitions_32MB_sticky.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
; Sticky's 32MB QSPI flash is booted conservatively in DIO mode. QIO causes
; early ROM watchdog resets on production hardware before the second-stage
; bootloader can finish loading. PSRAM remains octal.
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_STICKY

; The Sticky uses its MicroSD card for ebook storage when present and falls
; back to the internal "ebooks" LittleFS partition when no card is mounted.

; Experimental: newer H752-01 / Pro Lite, NOT the older H752.
[env:lilygo_t5s3_pro]
platform = espressif32@6.12.0
build_unflags = -Os
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16MB_lilygo.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_LILYGO_T5S3_PRO
    -O3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
